# XcodeGen 설정: `brew install xcodegen && xcodegen` 으로 ScreenLink.xcodeproj를 만든다.
name: ScreenLink
options:
  bundleIdPrefix: com.sonbumsu.screenlink
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Xcode → Signing & Capabilities에서 본인 Apple ID 팀을 고르세요.
    DEVELOPMENT_TEAM: ""
targets:
  ScreenLinkViewer:
    type: application
    platform: iOS
    sources:
      - path: iPad
        excludes: ["Info.plist"]
      - Shared
    settings:
      base:
        PRODUCT_NAME: ScreenLink
        PRODUCT_BUNDLE_IDENTIFIER: com.sonbumsu.screenlink.viewer
        INFOPLIST_FILE: iPad/Info.plist
        TARGETED_DEVICE_FAMILY: "2"

  ScreenLinkHost:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: ["Info.plist"]
      - Shared
    settings:
      base:
        PRODUCT_NAME: ScreenLink
        PRODUCT_BUNDLE_IDENTIFIER: com.sonbumsu.screenlink.host
        INFOPLIST_FILE: Mac/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Mac/Bridging/CGVirtualDisplay.h
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
